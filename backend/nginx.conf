worker_processes  1;

events {
    worker_connections  1024;
}

http {
    types_hash_max_size 4096;
    types_hash_bucket_size 128;

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Global Performance & Compression Settings
    client_max_body_size 25M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    ############################################################
    #  1. HTTPS Server Block: mrz25.info
    ############################################################
    server {
        listen 443 ssl; # managed by Certbot
        server_name  mrz25.info www.mrz25.info;

        root /app/webapp_tss/client_server/nginx/var/www/mrz25.info;
        index index.html;

        ssl_certificate /etc/letsencrypt/live/mrz25.info/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/mrz25.info/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        # Main frontend app
        location / {
            proxy_pass http://localhost:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /static/ {
            alias /app/webapp_tss/client_server/dist/;
        }

        # API backend
        location /api/ {
            proxy_pass http://localhost:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ############################################################
    #  2. HTTPS Server Block: tss2026.ca
    ############################################################
    server {
        listen 443 ssl;
        server_name tss2026.ca www.tss2026.ca;

        root /home/ec2-user/webapp_2026/nginx/var/www/tss2026.ca;
        index index.html;

        ssl_certificate /etc/letsencrypt/live/tss2026.ca/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/tss2026.ca/privkey.pem; # managed by Certbot

        # Main frontend app
        location / {
            proxy_pass http://localhost:7070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /frontend/ {
            proxy_pass http://localhost:7070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets
        location /static/ {
            alias /app/webapp_tss/client_server/dist/;
        }

        # API backend
        location /api/event/ {
            proxy_pass http://localhost:8473;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward /css to backend 8473
        location /css/ {
            proxy_pass http://localhost:8473;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

   ############################################################
    #  3. HTTP (Port 80) Redirect: Domains -> HTTPS
    ############################################################
    server {
        listen 80;
        server_name mrz25.info www.mrz25.info tss2026.ca www.tss2026.ca;
        return 301 https://$host$request_uri;
    }

    ############################################################
    #  4. HTTP Server Block: EC2 IP (13.222.67.9) & Curry & Co. -> Port 8001
    ############################################################
    server {
        listen 80;
        server_name 13.222.67.9 api.curryandco.ca admin.curryandco.ca;
        
                # 1. FastAPI API Endpoints
        location /api/ {
            proxy_pass http://127.0.0.1:8001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # 2. Uploaded Menu & Dish Images
        location /api/uploads/ {
            alias /var/www/curryco/backend/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # 3. System Health Probe
        location /health {
            proxy_pass http://127.0.0.1:8001/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Interactive Swagger & OpenAPI Documentation
        location /docs {
            proxy_pass http://127.0.0.1:8001/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8001/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. SPA Web Portal / Root Route
        location / {
            root /var/www/curryco/backend/web_dist;
            index index.html;
            try_files $uri $uri/ @backend;
        }

        # Fallback to FastAPI backend if static file not found
        location @backend {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    ############################################################
    #  5. HTTP Server Block: Bong Hneshel -> Port 8002
    ############################################################
    server {
        listen 8082;
        server_name 13.222.67.9 bong-hneshel.ca www.bong-hneshel.ca api.bong-hneshel.ca admin.bong-hneshel.ca;

        # 1. FastAPI API Endpoints
        location /api/ {
            proxy_pass http://127.0.0.1:8002/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # 2. Uploaded Menu & Dish Images
        location /api/uploads/ {
            alias /app/restaurant/bong-hneshel/backend/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # 3. System Health Probe
        location /health {
            proxy_pass http://127.0.0.1:8002/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Interactive Swagger & OpenAPI Documentation
        location /docs {
            proxy_pass http://127.0.0.1:8002/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8002/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. SPA Web Portal / Root Route
        location / {
            root /app/restaurant/bong-hneshel/backend/web_dist;
            index index.html;
            try_files $uri $uri/ @backend_bong;
        }

        # Fallback to FastAPI backend if static file not found
        location @backend_bong {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

